<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的奶蛙</title><style>*{box-sizing:border-box}body{margin:0;background:#fffdf8;font-family:system-ui,"PingFang SC",sans-serif;text-align:center;color:#51422e;overflow:hidden;touch-action:none}h1{margin:28px 0 4px;font-size:25px}p{margin:0;color:#a39a87;font-size:13px}.stage{height:calc(100dvh - 190px);display:flex;justify-content:center;align-items:center}.frog{position:relative;width:min(83vw,420px);aspect-ratio:2352/2880;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg));cursor:grab;touch-action:none}.frog img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;animation:breathe 3s infinite ease-in-out}@keyframes breathe{50%{transform:scale(1.015)}}.frog.laugh img{animation:laugh .13s 9 alternate}.frog.jump img{animation:jump .8s}.frog.wiggle img{animation:wiggle .65s}@keyframes laugh{to{transform:rotate(5deg) translateY(-6px)}}@keyframes jump{45%{transform:translateY(-65px)}75%{transform:scale(1.07,.94)}}@keyframes wiggle{25%{transform:rotate(-8deg)}70%{transform:rotate(7deg)}}.bubble{position:absolute;right:-3%;top:10%;background:white;border:1px solid #eedbb5;border-radius:18px;padding:9px 14px;box-shadow:0 5px 20px #aa8b4530;opacity:0;transition:.2s}.bubble.show{opacity:1}.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:white;padding:8px;border-radius:20px;box-shadow:0 5px 28px #a58d5529;max-width:98vw}button{border:0;border-radius:13px;background:#fff0ce;color:#745526;font-weight:700;padding:12px 10px;white-space:nowrap}#count{position:absolute;right:18px;top:25px;color:#a69b89;font-size:12px}</style></head><body><h1>我的奶蛙 🐸</h1><p>一只不太聪明，但很快乐的蛙</p><span id="count">互动 0 次</span><main class="stage"><div class="frog" id="frog"><img src="./frog.webp" alt="奶蛙"><div class="bubble" id="bubble">齁齁齁</div></div></main><nav class="controls"><button data-a="laugh">🤣 大笑</button><button data-a="jump">⬆️ 跳跳</button><button data-a="wiggle">🫳 摸摸</button><button data-a="feed">🍮 喂食</button><button data-a="reset">↩ 归位</button></nav><script>const f=document.querySelector('#frog'),b=document.querySelector('#bubble'),c=document.querySelector('#count');let n=0,x=0,y=0,down=null,moved=false,t;const words={laugh:['齁齁齁！','蛙哈哈哈哈'],jump:['起飞！','蹦！'],wiggle:['摸我干嘛','咕噜'],feed:['好吃！','嗝～'],reset:['我回来啦']};function place(){f.style.setProperty('--x',x+'px');f.style.setProperty('--y',y+'px')}function act(a){n++;c.textContent='互动 '+n+' 次';f.classList.remove('laugh','jump','wiggle');void f.offsetWidth;if(a==='reset'){x=y=0;place()}else f.classList.add(a==='feed'?'wiggle':a);const w=words[a];b.textContent=w[Math.floor(Math.random()*w.length)];b.classList.add('show');clearTimeout(t);t=setTimeout(()=>{b.classList.remove('show');f.classList.remove('laugh','jump','wiggle')},1300)}f.addEventListener('pointerdown',e=>{down={px:e.clientX,py:e.clientY,x,y};moved=false;f.setPointerCapture(e.pointerId)});f.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.px,dy=e.clientY-down.py;if(Math.hypot(dx,dy)>8)moved=true;if(moved){x=down.x+dx;y=down.y+dy;place()}});f.addEventListener('pointerup',e=>{if(!down)return;if(!moved){const r=f.getBoundingClientRect(),h=(e.clientY-r.top)/r.height;act(h<.35?'wiggle':h<.75?'laugh':'jump')}else act('wiggle');down=null});f.addEventListener('pointercancel',()=>down=null);document.querySelectorAll('button').forEach(el=>el.onclick=()=>act(el.dataset.a));</script></body></html>
