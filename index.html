<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的奶蛙</title>
<link rel="preload" href="./laugh.webp" as="image">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:#fffdf8;display:grid;place-items:center;font-family:system-ui,"PingFang SC",sans-serif}
main{text-align:center;padding:24px;width:100%}
#frog{display:block;width:min(80vw,420px,70dvh);height:min(80vw,420px,70dvh);margin:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;outline-offset:8px;border-radius:24px}
#frog:focus-visible{outline:2px solid #c0a66f}
img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;border-radius:24px}
p{margin:24px 0 0;color:#a39a87;font-size:13px}
</style>
</head>
<body>
<main><div id="frog" role="button" tabindex="0" aria-label="点奶蛙，捧腹大笑"><img src="./frog.webp" alt="奶蛙" draggable="false"></div><p>戳我一下</p></main>
<audio id="voice" src="./laugh.mp3" preload="auto"></audio>
<script>
const frog=document.querySelector('#frog'),img=frog.querySelector('img'),voice=document.querySelector('#voice');
let timer;
function stop(){clearTimeout(timer);voice.pause();voice.currentTime=0;img.src='./frog.webp'}
function laugh(){
 clearTimeout(timer);img.src='./laugh.webp';voice.currentTime=0;
 voice.play().catch(()=>{});
 timer=setTimeout(stop,16000);
}
frog.addEventListener('click',laugh);
frog.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();laugh()}});
voice.addEventListener('ended',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script>
</body>
</html>
